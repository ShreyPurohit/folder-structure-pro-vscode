# Build a VSIX and optionally attach it to a GitHub Release.
# Marketplace publishing is handled separately by the manual Publish workflow.

name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            create_github_release:
                description: 'Create or update a GitHub Release for this run'
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Build VSIX and GitHub Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Resolve package version
              id: meta
              shell: bash
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  VSIX="copy-folder-structure-${VERSION}.vsix"
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "vsix=${VSIX}" >> "$GITHUB_OUTPUT"

            - name: Build VSIX
              run: npx --yes @vscode/vsce@4.0.0 package --out "${{ steps.meta.outputs.vsix }}"

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v6
              with:
                  name: folder-structure-pro-${{ steps.meta.outputs.version }}
                  path: ${{ steps.meta.outputs.vsix }}
                  if-no-files-found: error
                  retention-days: 90

            - name: Create GitHub Release
              if: github.ref_type == 'tag' || inputs.create_github_release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
                  name: Folder Structure Pro ${{ steps.meta.outputs.version }}
                  generate_release_notes: true
                  files: ${{ steps.meta.outputs.vsix }}
                  fail_on_unmatched_files: true
                  target_commitish: ${{ github.sha }}
