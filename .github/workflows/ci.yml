name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Lint, format, typecheck, build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.21.0

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm run format:check

            - name: Compile
              run: pnpm run compile

            - name: Typecheck tests
              run: pnpm run check-types:test

            - name: Test core
              run: pnpm --filter @folder-structure-pro/core test

            - name: Typecheck core
              run: pnpm --filter @folder-structure-pro/core check-types

            - name: Build core
              run: pnpm --filter @folder-structure-pro/core build

    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.21.0

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run tests
              run: pnpm test

    cli-minimum-node:
        name: CLI minimum Node.js version (22.14.0)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.21.0

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '22.14.0'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Validate CLI package
              run: pnpm --filter folder-structure-pro run validate-package

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.21.0

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run coverage
              run: pnpm run test:coverage

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: coverage-report
                  path: coverage/
                  if-no-files-found: ignore
                  retention-days: 14

    package:
        name: Package VSIX
        runs-on: ubuntu-latest
        needs: [quality, test]
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.21.0

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Package VSIX
              run: pnpm dlx @vscode/vsce@4.0.0 package --no-dependencies --out copy-folder-structure.vsix

            - name: Upload VSIX
              uses: actions/upload-artifact@v6
              with:
                  name: folder-structure-pro-vsix
                  path: copy-folder-structure.vsix
                  if-no-files-found: error
                  retention-days: 14
