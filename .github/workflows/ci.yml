name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Lint, format, typecheck, build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Compile
              run: npm run compile

            - name: Typecheck tests
              run: npm run check-types:test

    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run coverage
              run: npm run test:coverage

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: coverage-report
                  path: coverage/
                  if-no-files-found: ignore
                  retention-days: 14

    package:
        name: Package VSIX
        runs-on: ubuntu-latest
        needs: [quality, test]
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Package VSIX
              run: npx --yes @vscode/vsce@4.0.0 package --out copy-folder-structure.vsix

            - name: Upload VSIX
              uses: actions/upload-artifact@v6
              with:
                  name: folder-structure-pro-vsix
                  path: copy-folder-structure.vsix
                  if-no-files-found: error
                  retention-days: 14
