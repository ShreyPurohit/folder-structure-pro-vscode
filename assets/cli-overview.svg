<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title description">
  <title id="title">Folder Structure Pro CLI overview</title>
  <desc id="description">Choose copy, export, or create from the interactive menu or a direct command, with the key inputs and safeguards for each.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="760" height="270" rx="14" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243247">
    <rect x="190" y="18" width="380" height="48" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="380" y="39" text-anchor="middle" font-size="15" font-weight="700">Start the CLI</text>
    <text x="380" y="56" text-anchor="middle" font-size="12" fill="#526174">Interactive menu or direct command</text>

    <path d="M380 66V84M130 84H630" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M130 84V100" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M380 84V100" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M630 84V100" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="20" y="102" width="220" height="116" rx="11" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="130" y="130" text-anchor="middle" font-size="16" font-weight="700">Copy</text>
    <text x="130" y="154" text-anchor="middle" font-size="12">Scan &amp; preview</text>
    <text x="130" y="177" text-anchor="middle" font-size="12">Set format, filters &amp; depth</text>
    <text x="130" y="200" text-anchor="middle" font-size="12" fill="#526174">Clipboard or print over SSH</text>

    <rect x="270" y="102" width="220" height="116" rx="11" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="380" y="130" text-anchor="middle" font-size="16" font-weight="700">Export</text>
    <text x="380" y="154" text-anchor="middle" font-size="12">Text or JSON output</text>
    <text x="380" y="177" text-anchor="middle" font-size="12">Save to file or stdout (-)</text>
    <text x="380" y="200" text-anchor="middle" font-size="12" fill="#526174">Existing files need --force</text>

    <rect x="520" y="102" width="220" height="116" rx="11" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="630" y="130" text-anchor="middle" font-size="16" font-weight="700">Create</text>
    <text x="630" y="154" text-anchor="middle" font-size="12">Clipboard, editor, file, stdin</text>
    <text x="630" y="177" text-anchor="middle" font-size="12">Validate &amp; preview first</text>
    <text x="630" y="200" text-anchor="middle" font-size="12" fill="#526174">Confirm destination &amp; conflicts</text>

    <rect x="20" y="233" width="720" height="26" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="380" y="251" text-anchor="middle" font-size="12">Esc / Ctrl+C cancels safely  ·  --help shows usage  ·  invalid options exit 2</text>
  </g>
</svg>
