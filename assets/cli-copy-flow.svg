<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title description">
  <title id="title">CLI copy flow</title>
  <desc id="description">The CLI uses system clipboard tools locally, avoids unsupported GNOME and VTE terminals over SSH, and tries OSC 52 in other supported terminals. Copy failures offer different fallbacks in the menu and direct command.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="760" height="300" rx="14" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243247">
    <text x="24" y="31" font-size="16" font-weight="700">How copy works</text>

    <rect x="22" y="116" width="145" height="48" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="94" y="145" text-anchor="middle" font-size="14" font-weight="700">Copy requested</text>

    <path d="M167 140H186" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M186 72V208" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M186 72H202" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M186 140H202" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M186 208H202" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="210" y="48" width="220" height="48" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="320" y="69" text-anchor="middle" font-size="13" font-weight="700">Local or ssh -X</text>
    <text x="320" y="86" text-anchor="middle" font-size="12" fill="#526174">Use system clipboard tools</text>
    <path d="M430 72H460" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="468" y="48" width="268" height="48" rx="9" fill="#ecfdf5" stroke="#86efac"/>
    <text x="602" y="78" text-anchor="middle" font-size="14" font-weight="700">Copied · confirmed</text>

    <rect x="210" y="116" width="220" height="48" rx="9" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="320" y="137" text-anchor="middle" font-size="13" font-weight="700">Plain SSH: GNOME / VTE</text>
    <text x="320" y="154" text-anchor="middle" font-size="12" fill="#526174">Ignores copy requests</text>
    <path d="M430 140H460" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="468" y="116" width="268" height="48" rx="9" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="602" y="137" text-anchor="middle" font-size="13" font-weight="700">Copy unavailable</text>
    <text x="602" y="154" text-anchor="middle" font-size="12" fill="#526174">Use a fallback below</text>

    <rect x="210" y="184" width="220" height="48" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="320" y="205" text-anchor="middle" font-size="13" font-weight="700">Other / unknown SSH terminal</text>
    <text x="320" y="222" text-anchor="middle" font-size="12" fill="#526174">Try OSC 52 if supported</text>
    <path d="M430 208H460" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="468" y="184" width="268" height="48" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="602" y="204" text-anchor="middle" font-size="13" font-weight="700">OSC 52 sent · unconfirmed</text>
    <text x="602" y="221" text-anchor="middle" font-size="12" fill="#526174">Paste to check</text>

    <rect x="22" y="248" width="714" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="379" y="266" text-anchor="middle" font-size="12">Interactive menu: print / save / cancel when copying is unavailable.</text>
    <text x="379" y="283" text-anchor="middle" font-size="12">Direct copy command: exit 1 with a hint to print or save.</text>
  </g>
</svg>
