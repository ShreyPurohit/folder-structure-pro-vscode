<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title description">
  <title id="title">CLI create flow</title>
  <desc id="description">Provide a structure, validate and preview it, choose a destination and resolve conflicts, then create the folders and empty files.</desc>
  <rect width="760" height="220" rx="14" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243247">
    <text x="24" y="31" font-size="16" font-weight="700">Create folders and empty files</text>

    <rect x="20" y="62" width="162" height="82" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="101" y="91" text-anchor="middle" font-size="14" font-weight="700">Provide structure</text>
    <text x="101" y="115" text-anchor="middle" font-size="12" fill="#526174">Clipboard · editor</text>
    <text x="101" y="132" text-anchor="middle" font-size="12" fill="#526174">file · standard input</text>

    <path d="M182 103h22" stroke="#94a3b8" stroke-width="2"/>
    <path d="m202 98 7 5-7 5" fill="#94a3b8"/>
    <rect x="210" y="62" width="162" height="82" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="291" y="91" text-anchor="middle" font-size="14" font-weight="700">Validate &amp; preview</text>
    <text x="291" y="116" text-anchor="middle" font-size="12" fill="#526174">Check paths and show</text>
    <text x="291" y="133" text-anchor="middle" font-size="12" fill="#526174">what will be created</text>

    <path d="M372 103h22" stroke="#94a3b8" stroke-width="2"/>
    <path d="m392 98 7 5-7 5" fill="#94a3b8"/>
    <rect x="400" y="62" width="162" height="82" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="481" y="91" text-anchor="middle" font-size="14" font-weight="700">Confirm</text>
    <text x="481" y="116" text-anchor="middle" font-size="12" fill="#526174">Choose destination</text>
    <text x="481" y="133" text-anchor="middle" font-size="12" fill="#526174">and handle conflicts</text>

    <path d="M562 103h22" stroke="#94a3b8" stroke-width="2"/>
    <path d="m582 98 7 5-7 5" fill="#94a3b8"/>
    <rect x="590" y="62" width="150" height="82" rx="10" fill="#ecfdf5" stroke="#86efac"/>
    <text x="665" y="91" text-anchor="middle" font-size="14" font-weight="700">Create</text>
    <text x="665" y="116" text-anchor="middle" font-size="12" fill="#526174">Folders and</text>
    <text x="665" y="133" text-anchor="middle" font-size="12" fill="#526174">empty files</text>

    <rect x="20" y="170" width="720" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="380" y="190" text-anchor="middle" font-size="13">Invalid input or cancelled confirmation: nothing is created.</text>
  </g>
</svg>
